server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: account-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
security:
  api-key: ${API_KEY}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:assessment}
    audience: ${JWT_AUDIENCE:assessment-api}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
  level:
    com.westpac.assessment: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.jdbc.core: "OFF"
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
