spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assessment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
